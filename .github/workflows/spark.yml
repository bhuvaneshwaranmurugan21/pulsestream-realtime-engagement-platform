name: Spark

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  transforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev,spark]'
      - run: SPARK_LOCAL_IP=127.0.0.1 pytest -m spark --no-cov
