name: Analytics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[analytics]'
      - run: dbt parse --project-dir dbt --profiles-dir dbt
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
