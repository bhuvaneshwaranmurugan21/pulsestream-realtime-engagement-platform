name: pulsestream
version: 1.0.0
config-version: 2
profile: pulsestream
model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
models:
  pulsestream:
    staging:
      +materialized: view
    marts:
      +materialized: incremental
      +incremental_strategy: delete+insert
